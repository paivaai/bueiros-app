<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D6A44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>Cadastro de Bueiros</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Início">
        <span class="mark" aria-hidden="true">BU</span>
        <span class="t"><b>Cadastro de Bueiros</b><small>Levantamento de campo</small></span>
      </a>
      <span id="conn" class="conn" role="status">—</span>
    </header>
    <div id="aviso-update" class="banner update" role="status" hidden>
      Nova versão disponível. <button type="button" id="btn-update" class="btn sm">Atualizar agora</button>
    </div>
    <div id="aviso-storage" class="banner erro" hidden>
      Armazenamento local indisponível neste navegador. Os dados serão perdidos ao fechar a página.
    </div>
    <main id="view"></main>
  </div>

  <div id="actionbar" class="actionbar" hidden></div>
  <div id="modal" class="modal-back" hidden></div>
  <input type="file" id="kmz-file" accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml,application/octet-stream" hidden>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>
  <input type="file" id="home-file" accept=".txt,.csv,.dat,.xyz,text/*" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Scripts clássicos (sem módulos ES) para funcionar também abrindo o arquivo direto, sem servidor. -->
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/points.js"></script>
  <script src="js/section-drawing.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/export.js"></script>
  <script src="js/kmz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
